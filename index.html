<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Đàn Bầu &amp; Đàn Tranh — Physical Model</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#12100d;color:#e8dcc8;

  #topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;

  .tab.on{background:#5a3d17;color:#ffe6b0;border-color:#8a6a33;}

  #cv{position:absolute;top:52px;left:0;right:0;bottom:0;display:block;cursor:crosshair;}
  #hud{position:fixed;left:14px;bottom:12px;background:rgba(18,14,8,.78);border:1px solid #3a2f1e;

    font-family:inherit;font-size:12px;}

<body>

<div id="topbar">
  <h1>Đàn Bầu &middot; Đàn Tranh</h1>
  <button class="tab on" id="tabBau">Đàn Bầu</button>
  <button class="tab" id="tabTranh">Đàn Tranh</button>
  <label class="sm">dây</label>
  <select id="selCount"><option>16</option><option>17</option><option>19</option><option>21</option></select>

<div id="overlay">
  <h2>Đàn Bầu &amp; Đàn Tranh</h2>
  <p>Mô hình vật lý — digital waveguide synthesis</p>
  <p>Physical model of Vietnamese monochord and 16-string zither</p>
  <div class="go">Nhấp để bắt đầu — click to begin</div>
  <p id="err"></p>
</div>

<script id="dsp" type="text/worklet">
'use strict';
const FS = sampleRate;
const TAU = 6.283185307179586;
const BLK = 128;
function clamp(x,a,b){ return x<a?a:(x>b?b:x); }

/* ---------- fractional delay line, 4-point Hermite interpolation ---------- */
class FDelay{
  constructor(maxLen){
    let n=8; while(n<maxLen+8) n<<=1;
    this.b=new Float32Array(n); this.mask=n-1; this.w=0;
  }
  clear(){ this.b.fill(0); }
  write(x){ this.w=(this.w+1)&this.mask; this.b[this.w]=x; }
  read(d){                    /* d>=3 samples; call before write() each tick */
    const p=this.w+1-d;
    let i=Math.floor(p);
    const f=p-i;
    const b=this.b,m=this.mask;
    const xm1=b[(i-1)&m], x0=b[i&m], x1=b[(i+1)&m], x2=b[(i+2)&m];
    const c1=0.5*(x1-xm1);
    const c2=xm1-2.5*x0+2*x1-0.5*x2;
    const c3=0.5*(x2-xm1)+1.5*(x0-x1);
    return ((c3*f+c2)*f+c1)*f+x0;
  }
}

/* ---------- one-pole lowpass with analytic phase-delay ---------- */
class LP1{
  constructor(){ this.a=0.5; this.y=0; }
  set(fc){ this.a=1-Math.exp(-TAU*clamp(fc,20,FS*0.45)/FS); }
  pro(x){ return this.y+=this.a*(x-this.y); }
  pd(f){
    const w=TAU*f/FS, b=1-this.a;
    return Math.atan2(b*Math.sin(w),1-b*Math.cos(w))/w;
  }
  mag(f){
    const w=TAU*f/FS, b=1-this.a;
    return this.a/Math.sqrt(1-2*b*Math.cos(w)+b*b);
  }
}

/* ---------- first-order allpass (dispersion), numeric phase-delay ---------- */
class AP1{
  constructor(){ this.a=0; this.x1=0; this.y1=0; }
  pro(x){ const y=this.a*(x-this.y1)+this.x1; this.x1=x; this.y1=y; return y; }
  pd(f){
    const w=TAU*f/FS, a=this.a, cw=Math.cos(w), sw=Math.sin(w);
    const ph=Math.atan2(-sw,a+cw)-Math.atan2(-a*sw,1+a*cw);
    return -ph/w;
  }
}

/* ---------- decaying two-pole resonator (body mode) ---------- */
class Mode{
  constructor(f,t60,g,pan){
    const r=Math.exp(-6.9078/(t60*FS));
    this.a1=2*r*Math.cos(TAU*f/FS); this.a2=-r*r; this.n=(1-r);
    this.y1=0; this.y2=0; this.g=g;
    this.gl=g*Math.sqrt(0.5-0.5*pan); this.gr=g*Math.sqrt(0.5+0.5*pan);
  }
  pro(x){
    const y=this.a1*this.y1+this.a2*this.y2+x*this.n;
    this.y2=this.y1; this.y1=y; return y;
  }
}

class DCB{
  constructor(fc){ this.R=1-TAU*fc/FS; this.x1=0; this.y1=0; }
  pro(x){ const y=x-this.x1+this.R*this.y1; this.x1=x; this.y1=y; return y; }
}

/* =====================================================================
   PString — bidirectional digital waveguide string.
   Four rail segments around a movable scattering junction (the touching
   finger on đàn bầu; a transparent point on đàn tranh):
       nut --rA--> [junction] --rB--> bridge
       nut <--lA-- [junction] <--lB-- bridge
   The junction damps as a transverse dashpot of resistance R against
   string impedance Z=1:  rho=-R/(R+2), tau=1+rho.
   Bridge reflection = -g * LP(x) followed by dispersion allpasses;
   loop delay is compensated with the filters' phase delay at f0 so the
   string tunes exactly, and pitch is driven by a *tension ratio*
   (f ∝ sqrt(T)) smoothed per-sample through the fractional delays.
===================================================================== */
class PString{
  constructor(){
    this.rA=new FDelay(2048); this.lA=new FDelay(2048);
    this.rB=new FDelay(2048); this.lB=new FDelay(2048);
    this.combP=new FDelay(4096); this.combH=new FDelay(4096);
    this.bLP=new LP1(); this.nLP=new LP1(); this.nLP.set(11000);
    this.ap1=new AP1(); this.ap2=new AP1();
    this.baseF=130.813; this.f0=130.813;
    this.cut0=5000; this.t60=8; this.gLoop=0.997;
    this.jpos=0.5;
    this.d=180; this.dTarget=180;
    this.kD=1-Math.exp(-1/(0.0035*FS));
    this.fingerR=0; this.fingerDecay=1;
    this.excI=1; this.excN=0; this.excLife=0;
    this.excAmp=0; this.excAngle=0.3; this.excSkew=1;
    this.excLP=new LP1(); this.excLP.set(6000);
    this.pluckPos=0.28; this.combPD=50; this.combHD=0; this.harmN=1;
    this.puAbs=0.94; this.pickupOn=false; this.puOut=0;
    this.symIn=0; this.bridgeOut=0;
    this.energy=0; this.active=false; this.qb=0;
    this.pressCents=0; this.pressTarget=0; this.pv=0;
    this.centsExtra=0;
  }
  retune(){
    const cents=this.pressCents+this.centsExtra;
    const tr=Math.pow(2,cents/600);              /* tension ratio, f ∝ √T */
    const f=this.baseF*Math.sqrt(tr);
    this.f0=f;
    this.bLP.set(this.cut0*(0.70+0.30*tr));      /* tension→brightness coupling */
    /* normalize total loop loss at f0 so the fundamental decays at exactly
       t60; partials above f0 decay faster through the loss filters.
       Ceiling keeps DC loop gain (g*0.998) strictly below 1. */
    const target=Math.exp(-6.9078/(f*this.t60));
    const m=0.998*this.bLP.mag(f)*this.nLP.mag(f);
    this.gLoop=Math.min(target/m,1.0015);
    const P=FS/f;
    const comp=this.bLP.pd(f)+this.nLP.pd(f)+this.ap1.pd(f)+this.ap2.pd(f);
    this.dTarget=Math.max(10,(P-comp)*0.5);
  }
  pluck(vel,pos,stiff,angle,harmN,fingerP){
    vel=clamp(vel,0.03,1);
    this.pluckPos=clamp(pos,0.04,0.62);
    this.harmN=harmN;
    const wMs=0.35+2.3*(1-vel)+1.6*(1-clamp(stiff,0,1));
    /* contact ends when the returning wave lifts the string off the pick:
       cap the impulse width well inside one period */
    this.excN=Math.max(4,Math.round(Math.min(wMs*0.001*FS,1.3*this.d)));
    this.excI=0;
    this.excAmp=0.22+0.95*vel*vel;
    this.excAngle=clamp(angle,0,1);
    this.excSkew=0.65+0.6*(1-vel);
    this.excLP.set(900+(2200+8500*vel)*clamp(stiff,0.15,1));
    this.excLP.y=0;
    this.combP.clear(); this.combH.clear();
    this.combPD=clamp(2*this.d*this.pluckPos,4,4000);
    this.combHD=harmN>1?clamp(2*this.d/harmN,4,4000):0;
    this.excLife=this.excN+Math.ceil(this.combPD+this.combHD)+8;
    if(fingerP>0){
      this.fingerR=fingerP;
      this.fingerDecay=Math.exp(-1/((0.045+Math.random()*0.07)*FS));
    }
    this.active=true; this.qb=0;
  }
  damp(amount,ms){
    this.fingerR=Math.max(this.fingerR,amount);
    this.fingerDecay=Math.exp(-1/(ms*0.001*FS));
    this.active=true;
  }
  tick(){
    this.d+=this.kD*(this.dTarget-this.d);
    const dA=Math.max(3,this.d*this.jpos);
    const dB=Math.max(3,this.d*(1-this.jpos));

    /* excitation pipeline: shaped impulse -> pick LP -> pluck-position
       comb -> harmonic comb -> one-directional injection at junction */
    let e=0;
    if(this.excI<this.excLife){
      let e0=0;
      if(this.excI<this.excN){
        let ph=this.excI/this.excN;
        ph=Math.pow(ph,this.excSkew);
        const bump=0.5*(1-Math.cos(TAU*ph));
        const slope=Math.sin(TAU*ph);
        e0=this.excAmp*((1-0.6*this.excAngle)*bump+0.6*this.excAngle*slope);
      }
      e0=this.excLP.pro(e0);
      const dl=this.combP.read(this.combPD);
      this.combP.write(e0);
      e=e0-0.95*dl;
      if(this.harmN>1){
        const dh=this.combH.read(this.combHD);
        this.combH.write(e);
        e=0.5*(e+dh);
      }
      this.excI++;
    }

    const aJ=this.rA.read(dA);
    const bJ=this.lB.read(dB);
    let toB,toA;
    const R=this.fingerR;
    if(R>1e-4){
      const rho=-R/(R+2), tau=1+rho;
      toB=tau*aJ+rho*bJ;
      toA=tau*bJ+rho*aJ;
      this.fingerR*=this.fingerDecay;
    }else{
      toB=aJ; toA=bJ;
    }
    toB+=e;    /* one-directional: pick sits between touch point and bridge */

    const atB=this.rB.read(dB);
    let refl=-this.gLoop*this.bLP.pro(atB);
    refl=this.ap2.pro(this.ap1.pro(refl));
    const atN=this.lA.read(dA);
    const nr=-0.998*this.nLP.pro(atN);

    this.rB.write(toB);
    this.lB.write(refl+this.symIn);
    this.rA.write(nr);
    this.lA.write(toA);

    this.bridgeOut=atB;
    if(this.pickupOn){
      const q=clamp((this.puAbs-this.jpos)/(1-this.jpos),0.05,0.95);
      this.puOut=this.rB.read(Math.max(3,dB*q))+this.lB.read(Math.max(3,dB*(1-q)));
    }
    this.energy=0.999*this.energy+0.001*atB*atB;
    return atB;
  }
}
/* =====================================================================
   ĐÀN BẦU — one string, harmonic-node touch, flexible pitch rod,
   magnetic pickup, lacquered-box body modes.
===================================================================== */
class BauEngine{
  constructor(){
    const s=new PString();
    s.baseF=130.813;                       /* open string C3 */
    s.cut0=5200; s.t60=8.5;
    s.ap1.a=-0.10; s.ap2.a=-0.10;
    s.pickupOn=true; s.puAbs=0.94;
    s.jpos=0.5;
    s.retune();
    this.s=s;
    this.node=4;
    this.rodU=0; this.rodSm=0;
    this.scoop=0;
    this.gest={rungOn:false,rungAmp:0,ph:0,rate:5.6,jit:0,nhanOn:false,nx:0,nv:0};
    this.kA=1-Math.exp(-BLK/(0.13*FS));
    this.kR=1-Math.exp(-BLK/(0.22*FS));
    this.dc=new DCB(32);
    this.puLP=new LP1(); this.puLP.set(8200);
    this.pres=new Mode(2850,0.004,0.55,0);
    this.compEnv=0;
    this.body=[
      new Mode(112,0.30,0.85,-0.30),
      new Mode(198,0.24,0.65, 0.25),
      new Mode(288,0.18,0.45,-0.10),
      new Mode(475,0.14,0.40, 0.30),
      new Mode(720,0.10,0.30,-0.20),
      new Mode(1240,0.06,0.22, 0.10)
    ];
    this.ampMod=1;
    this.oL=0; this.oR=0;
    this.blockActive=false;
  }
  pluck(node,vel,pos){
    const s=this.s, n=node;
    this.node=n;
    /* touch node measured from the bridge; slight touch-placement variance */
    s.jpos = n>1 ? clamp(1-1/n+(Math.random()-0.5)*0.008,0.1,0.9) : 0.30;
    const p=clamp(pos*(0.94+Math.random()*0.12),0.05,0.6);
    s.pluck(vel,p,0.85,0.35,n, n>1?0.9+0.9*vel:0.25);
    this.scoop=-(3+Math.random()*8);
  }
  vo(){
    this.s.damp(2.6,55);
    this.s.pluck(0.28,0.5,0.3,0.8,this.node,2.6);
  }
  control(){
    const s=this.s;
    if(s.active && s.excI>=s.excLife && s.energy<1e-12){
      if(++s.qb>40) s.active=false;
    }else s.qb=0;

    this.rodSm+=0.10*(this.rodU-this.rodSm);
    const u=this.rodSm;
    /* rod stiffness rises toward the extremes: tanh-compressed travel,
       asymmetric range (pulling lowers pitch further than pushing raises) */
    const bend = u>=0 ? 330*Math.tanh(1.45*u)/0.8957
                      : 520*Math.tanh(1.65*u)/0.9289;
    const G=this.gest;
    G.rungAmp += G.rungOn ? this.kA*(1-G.rungAmp) : -this.kR*G.rungAmp;
    let g=0;
    this.ampMod=1;
    if(G.rungAmp>1e-3){
      G.jit+=0.05*((Math.random()*2-1)*0.10-G.jit);   /* wrist-rate drift */
      G.ph+=TAU*G.rate*(1+G.jit)*BLK/FS;
      if(G.ph>TAU) G.ph-=TAU;
      g+=G.rungAmp*40*(Math.sin(G.ph)+0.15*Math.sin(2*G.ph+0.8));
      this.ampMod=1+G.rungAmp*0.06*Math.sin(G.ph-0.6);
    }
    const dt=BLK/FS, w0=TAU*4.3, zz=0.72;         /* nhấn: underdamped arm */
    const tgt=G.nhanOn?170:0;
    G.nv+=(w0*w0*(tgt-G.nx)-2*zz*w0*G.nv)*dt;
    G.nx+=G.nv*dt;
    g+=G.nx;
    this.scoop*=0.84;
    s.centsExtra=bend+g+this.scoop;
    s.retune();
    this.blockActive = s.active || G.rungAmp>1e-3 || Math.abs(G.nx)>0.5;
  }
  tick(){
    if(!this.blockActive){ this.oL=0; this.oR=0; return; }
    const s=this.s;
    s.symIn=0;
    const br=s.tick();
    /* pickup: DC rolloff -> soft magnetic compression -> mild asymmetric
       saturation -> presence resonance -> top rolloff */
    let pu=this.dc.pro(s.puOut);
    const a=Math.abs(pu);
    this.compEnv += (a>this.compEnv?0.004:0.0004)*(a-this.compEnv);
    pu*=1/(1+1.6*this.compEnv);
    const x=pu*1.5;
    pu=Math.tanh(x+0.07*x*x)/1.5;
    pu=pu+0.6*this.pres.pro(pu);
    pu=this.puLP.pro(pu);
    let bl=0,brr=0;
    const B=this.body;
    for(let k=0;k<6;k++){
      const md=B[k], v=md.pro(br);
      bl+=v*md.gl; brr+=v*md.gr;
    }
    const m=this.ampMod;
    this.oL=(pu*2.0+bl*1.7)*m;
    this.oR=(pu*2.0+brr*1.7)*m;
  }
}

/* =====================================================================
   ĐÀN TRANH — up to 21 independent strings, movable bridges,
   sympathetic coupling through a shared bridge/soundboard bus.
===================================================================== */
class TranhEngine{
  constructor(){
    this.S=[];
    this.panL=new Float32Array(21); this.panR=new Float32Array(21);
    this.rad=new Float32Array(21);   /* soundboard radiation efficiency tilt */
    for(let i=0;i<21;i++){
      const s=new PString();
      s.jpos=0.34; s.pickupOn=false;
      this.S.push(s);
    }
    this.count=16; this.invN=1/16;
    this.busLP=new LP1(); this.busLP.set(1700);
    this.busState=0; this.busEnv=0;
    /* rank-1 bridge coupling: every string receives the same filtered
       mean bridge wave, own term included, sign opposite the reflection.
       Only the common mode is shifted (subtractively) -> passive/stable. */
    this.symG=0.05;
    this.body=[
      new Mode(186,0.26,0.70,-0.35),
      new Mode(262,0.22,0.60, 0.30),
      new Mode(334,0.18,0.50,-0.15),
      new Mode(408,0.15,0.45, 0.20),
      new Mode(524,0.12,0.38,-0.25),
      new Mode(702,0.09,0.32, 0.15),
      new Mode(942,0.07,0.26,-0.10),
      new Mode(1310,0.05,0.20, 0.05),
      new Mode(1780,0.045,0.30, 0.18),
      new Mode(2560,0.035,0.26,-0.14),
      new Mode(3620,0.028,0.20, 0.08),
      new Mode(5100,0.022,0.14,-0.05)
    ];
    this.oL=0; this.oR=0;
    this.blockActive=false;
  }
  config(freqs,Bs,t60s,count){
    this.count=count; this.invN=1/count;
    for(let i=0;i<count;i++){
      const s=this.S[i];
      s.baseF=freqs[i]; s.t60=t60s[i];
      s.cut0=clamp(14*freqs[i]+1500,3500,21000);
      const aDisp=-clamp(14*Math.sqrt(Bs[i])*Math.sqrt(freqs[i]/100),0.02,0.5);
      s.ap1.a=aDisp; s.ap2.a=aDisp;
      s.pressCents=0; s.pressTarget=0; s.pv=0; s.centsExtra=0;
      s.rA.clear(); s.lA.clear(); s.rB.clear(); s.lB.clear();
      s.energy=0; s.active=false; s.excI=1; s.excLife=0; s.fingerR=0;
      s.retune(); s.d=s.dTarget;
      const p=-0.55+1.1*i/Math.max(1,count-1);
      this.panL[i]=Math.sqrt(0.5-0.5*p*0.7);
      this.panR[i]=Math.sqrt(0.5+0.5*p*0.7);
      this.rad[i]=Math.pow(freqs[i]/131,0.45);
    }
    this.busState=0; this.busEnv=0;
  }
  pluck(i,vel,pos,stiff,angle){
    if(i<0||i>=this.count) return;
    this.S[i].pluck(vel,pos*(0.96+Math.random()*0.08),stiff,angle,1,0);
  }
  press(i,cents){
    if(i<0||i>=this.count) return;
    this.S[i].pressTarget=clamp(cents,0,380);
    this.S[i].active=true;
  }
  vo(i){ if(i>=0&&i<this.count) this.S[i].damp(2.2,60); }
  control(){
    const dt=BLK/FS, w0=TAU*6.0, zz=0.85;   /* left-hand press dynamics */
    let any=false;
    for(let i=0;i<this.count;i++){
      const s=this.S[i];
      if(s.active && s.excI>=s.excLife && s.energy<1e-12 &&
         Math.abs(s.pressCents)<0.5 && Math.abs(s.pressTarget)<0.5){
        if(++s.qb>40) s.active=false;
      }else s.qb=0;
      s.pv+=(w0*w0*(s.pressTarget-s.pressCents)-2*zz*w0*s.pv)*dt;
      s.pressCents+=s.pv*dt;
      if(s.active) s.retune();
      if(s.active) any=true;
    }
    this.blockActive = any || this.busEnv>1e-7;
  }
  tick(){
    if(!this.blockActive){ this.oL=0; this.oR=0; return; }
    const sy=this.busState*this.symG;
    let nb=0, l=0, r=0;
    const N=this.count, S=this.S;
    const busLive=this.busEnv>1e-7;
    for(let i=0;i<N;i++){
      const s=S[i];
      if(!s.active && !busLive) continue;
      s.symIn=sy;
      const br=s.tick();
      nb+=br;
      const dg=0.08*this.rad[i];
      l+=br*dg*this.panL[i];
      r+=br*dg*this.panR[i];
    }
    this.busEnv=0.999*this.busEnv+0.001*Math.abs(nb);
    this.busState=this.busLP.pro(nb*this.invN);
    const B=this.body;
    for(let k=0;k<12;k++){
      const md=B[k], v=md.pro(nb);
      l+=v*md.gl*0.6; r+=v*md.gr*0.6;
    }
    this.oL=l; this.oR=r;
  }
}

class Engine extends AudioWorkletProcessor{
  constructor(){
    super();
    this.bau=new BauEngine();
    this.tranh=new TranhEngine();
    this.port.onmessage=(ev)=>{ this.onMsg(ev.data); };
  }
  onMsg(m){
    const b=this.bau, t=this.tranh;
    switch(m.t){
      case 'bauPluck': b.pluck(m.node,m.vel,m.pos); break;
      case 'bauRod':   b.rodU=clamp(m.v,-1,1); break;
      case 'bauG':
        if(m.g==='rung') b.gest.rungOn=!!m.on;
        else if(m.g==='nhan') b.gest.nhanOn=!!m.on;
        break;
      case 'bauVo':    b.vo(); break;
      case 'tranhCfg': t.config(m.freqs,m.B,m.t60,m.count); break;
      case 'tranhPluck': t.pluck(m.i,m.vel,m.pos,m.stiff,m.angle); break;
      case 'tranhPress': t.press(m.i,m.cents); break;
      case 'tranhVo':  t.vo(m.i); break;
    }
  }
  process(inputs,outputs){
    const out=outputs[0];
    const L=out[0], R=out.length>1?out[1]:out[0];
    const n=L.length;
    const b=this.bau, t=this.tranh;
    b.control(); t.control();
    if(!b.blockActive && !t.blockActive){
      for(let i=0;i<n;i++){ L[i]=0; R[i]=0; }
      return true;
    }
    for(let i=0;i<n;i++){
      b.tick(); t.tick();
      const l=b.oL+t.oL, r=b.oR+t.oR;
      L[i]=Math.tanh(l*0.85);
      R[i]=Math.tanh(r*0.85);
    }
    return true;
  }
}
registerProcessor('vn-engine',Engine);
</script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,t)=>a+(b-a)*t;

/* ------------------------------------------------------------------ */
/* đàn tranh string set: pentatonic (Do Re Mi Sol La), top string C6.
   Length / diameter / tension per string feed a physical inharmonicity
   coefficient B = pi^3 E d^4 / (64 T L^2); wound basses use a thin
   effective core diameter. */
function tranhSpecs(count){
  const steps=[0,2,4,7,9], midis=[];
  for(let oct=1;oct<=7;oct++) for(const s of steps) midis.push(12*oct+12+s);
  const top=midis.indexOf(84);
  const sel=midis.slice(top-count+1,top+1);
  return sel.map((m,i)=>{
    const f=440*Math.pow(2,(m-69)/12);
    const x=i/(count-1);
    const L=1.02-0.72*x;
    const dia=0.00080-0.00035*x;
    const rho=7850, mu=rho*Math.PI*dia*dia/4;
    const T=Math.pow(2*L*f,2)*mu;
    const dEff=f<180?dia*0.42:dia;
    const B=Math.pow(Math.PI,3)*2.0e11*Math.pow(dEff,4)/(64*T*L*L);
    const t60=clamp(9*Math.pow(150/f,0.55),1.8,10);
    return {f,B,t60,L,dia,T,midi:m};
  });
}
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName=m=>NOTE_NAMES[m%12]+(Math.floor(m/12)-1);

const TRANH_CODES=['KeyZ','KeyX','KeyC','KeyV','KeyB','KeyN','KeyM','Comma','Period','Slash',
  'KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK','KeyL','Semicolon','Quote'];
const TRANH_LABELS=['Z','X','C','V','B','N','M',',','.','/','A','S','D','F','G','H','J','K','L',';','\''];

const state={
  inst:'bau',
  running:false,
  bau:{node:4,rodU:0,rodVis:0,strength:0.7,pos:0.28,rung:false,nhan:false,
       fingerT:0,fingerFrac:0.75,mx:0.5,my:0.5},
  tranh:{count:16,specs:tranhSpecs(16),pluckPos:0.30,stiff:0.5,
         pressI:-1,pressCents:0,pressStartY:0,lastPluck:-1}
};

/* ------------------------------------------------------------------ */
let actx=null,node=null;
function send(m){ if(node) node.port.postMessage(m); }

async function startAudio(sr){
  if(actx){ try{ await actx.close(); }catch(e){} actx=null; node=null; }
  actx=new AudioContext({latencyHint:0,sampleRate:sr});
  const code=$('dsp').textContent;
  const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
  await actx.audioWorklet.addModule(url);
  node=new AudioWorkletNode(actx,'vn-engine',
    {numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[2]});
  node.connect(actx.destination);
  await actx.resume();
  sendTranhCfg();
  $('lat').textContent='fs '+(actx.sampleRate/1000)+' kHz · latency ~'+
    Math.round((actx.baseLatency||0)*1000)+' ms';
}
function sendTranhCfg(){
  const sp=state.tranh.specs;
  send({t:'tranhCfg',count:sp.length,
    freqs:sp.map(s=>s.f), B:sp.map(s=>s.B), t60:sp.map(s=>s.t60)});
}

/* ------------------------------------------------------------------ */
function bauPluck(){
  const b=state.bau;
  const vel=clamp(b.strength*(0.9+Math.random()*0.2),0.05,1);
  send({t:'bauPluck',node:b.node,vel,pos:b.pos});
  b.fingerT=1;
  b.fingerFrac=b.node>1?1-1/b.node:0.3;
  visBauPluck(1-b.pos,vel);
}
function tranhPluck(i){
  const t=state.tranh;
  if(i<0||i>=t.count) return;
  const vel=clamp(0.72*(0.85+Math.random()*0.3),0.05,1);
  const stiff=t.stiff, angle=0.3;
  send({t:'tranhPluck',i,vel,pos:t.pluckPos,stiff,angle});
  t.lastPluck=i;
  visTranhPluck(i,t.pluckPos,vel);
}

/* ------------------------------------------------------------------ */
const cv=$('cv'); const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight-52;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildLayouts(); buildBG();
}
window.addEventListener('resize',resize);

/* ---------------- input: keyboard ---------------- */
window.addEventListener('keydown',e=>{
  if(!state.running) return;
  if(e.code==='Space'){ e.preventDefault(); }
  if(state.inst==='bau'){
    if(e.code.startsWith('Digit')){
      const k=parseInt(e.code.slice(5),10);
      if(k>=1&&k<=7&&!e.repeat){ state.bau.node=k+1; bauPluck(); }
    }else if(e.code==='Space'&&!e.repeat){
      state.bau.rung=true; send({t:'bauG',g:'rung',on:true});
    }else if((e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat){
      state.bau.nhan=true; send({t:'bauG',g:'nhan',on:true});
    }else if(e.code==='KeyV'&&!e.repeat){
      send({t:'bauVo'}); visBauPluck(0.5,0.25); state.bau.fingerT=1;
    }
  }else{
    const idx=TRANH_CODES.indexOf(e.code);
    if(idx>=0&&idx<state.tranh.count&&!e.repeat){ tranhPluck(idx); }
    else if(e.code==='ShiftLeft'||e.code==='ShiftRight'){ state.tranh.stiff=0.95; }
  }
});
window.addEventListener('keyup',e=>{
  if(state.inst==='bau'){
    if(e.code==='Space'){ state.bau.rung=false; send({t:'bauG',g:'rung',on:false}); }
    else if(e.code==='ShiftLeft'||e.code==='ShiftRight'){
      state.bau.nhan=false; send({t:'bauG',g:'nhan',on:false});
    }
  }else if(e.code==='ShiftLeft'||e.code==='ShiftRight'){ state.tranh.stiff=0.5; }
});
window.addEventListener('blur',()=>{
  if(state.bau.rung){ state.bau.rung=false; send({t:'bauG',g:'rung',on:false}); }
  if(state.bau.nhan){ state.bau.nhan=false; send({t:'bauG',g:'nhan',on:false}); }
  state.tranh.stiff=0.5;
  releaseTranhPress();
});

/* ---------------- input: mouse ---------------- */
let rodDirty=false;
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  const xN=clamp((e.clientX-r.left)/W,0,1), yN=clamp((e.clientY-r.top)/H,0,1);
  if(state.inst==='bau'){
    const b=state.bau;
    b.mx=xN; b.my=yN;
    b.rodU=clamp((0.5-yN)*2.4,-1,1);
    b.strength=0.30+0.70*xN;
    b.pos=0.42-0.32*xN;
    rodDirty=true;
  }else{
    const t=state.tranh;
    if(t.pressI>=0){
      const dy=(e.clientY-r.top)-t.pressStartY;
      t.pressCents=clamp(dy*2.0,0,340);
      send({t:'tranhPress',i:t.pressI,cents:t.pressCents});
    }
  }
});
cv.addEventListener('mousedown',e=>{
  if(!state.running) return;
  const r=cv.getBoundingClientRect();
  const y=e.clientY-r.top;
  if(state.inst==='bau'){ bauPluck(); }
  else{
    const i=nearestTranhString(y);
    if(i>=0){
      const t=state.tranh;
      t.pressI=i; t.pressStartY=y; t.pressCents=0;
      t.lastPluck=i;
    }
  }
});
window.addEventListener('mouseup',()=>{ releaseTranhPress(); });
function releaseTranhPress(){
  const t=state.tranh;
  if(t.pressI>=0){
    send({t:'tranhPress',i:t.pressI,cents:0});
    t.pressI=-1; t.pressCents=0;
  }
}
cv.addEventListener('dblclick',e=>{
  if(state.inst==='tranh'){
    const r=cv.getBoundingClientRect();
    const i=nearestTranhString(e.clientY-r.top);
    if(i>=0) send({t:'tranhVo',i});
  }
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(state.inst==='tranh'){
    const t=state.tranh;
    t.pluckPos=clamp(t.pluckPos+e.deltaY*0.0004,0.08,0.5);
  }
},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------------- UI chrome ---------------- */
function setInst(which){
  state.inst=which;
  $('tabBau').classList.toggle('on',which==='bau');
  $('tabTranh').classList.toggle('on',which==='tranh');
  $('selCount').style.visibility=which==='tranh'?'visible':'hidden';
  releaseTranhPress();
  buildBG(); updateHelp();
}
$('tabBau').onclick=()=>setInst('bau');
$('tabTranh').onclick=()=>setInst('tranh');
$('selCount').onchange=()=>{
  const c=parseInt($('selCount').value,10);
  state.tranh.count=c;
  state.tranh.specs=tranhSpecs(c);
  sendTranhCfg();
  buildLayouts(); buildBG(); buildTranhVis();
};
$('selSR').onchange=async()=>{
  if(!state.running) return;
  try{ await startAudio(parseInt($('selSR').value,10)); }
  catch(err){ $('lat').textContent='SR switch failed: '+err.message; }
};
function updateHelp(){
  const h=$('help');
  if(state.inst==='bau'){
    h.innerHTML='<h3>Đàn Bầu</h3>'+
      '<kbd>1</kbd>–<kbd>7</kbd> gảy tại nút bồi âm (harmonics 2–8) &nbsp;·&nbsp; '+
      '<kbd>click</kbd> gảy lại<br>'+
      'chuột <b>dọc</b>: cần đàn (uốn cao/thấp) &nbsp;·&nbsp; chuột <b>ngang</b>: lực &amp; vị trí gảy<br>'+
      '<kbd>Space</kbd> rung (vibrato) &nbsp;·&nbsp; <kbd>Shift</kbd> nhấn (press) &nbsp;·&nbsp; '+
      '<kbd>V</kbd> vỗ (tap)';
  }else{
    h.innerHTML='<h3>Đàn Tranh</h3>'+
      'phím <kbd>Z</kbd>…<kbd>/</kbd> rồi <kbd>A</kbd>…<kbd>\'</kbd> gảy dây (thấp → cao)<br>'+
      '<b>kéo chuột xuống</b> trên dây: nhấn/vuốt sau nhạn (bend, microtonal)<br>'+
      '<b>lăn chuột</b>: vị trí gảy &nbsp;·&nbsp; <kbd>Shift</kbd> móng cứng &nbsp;·&nbsp; '+
      '<b>double-click</b> vỗ chặn dây';
  }
}

/* ---------------- boot ---------------- */
$('overlay').addEventListener('click',async()=>{
  if(state.running) return;
  try{
    await startAudio(parseInt($('selSR').value,10));
    state.running=true;
    $('overlay').style.display='none';
    setInst('bau');
  }catch(err){
    $('err').textContent='Không khởi động được audio engine:\n'+err.message+
      '\n(Hãy thử Chrome/Edge mới nhất.)';
  }
});
/* ==================================================================
   VISUAL PHYSICS — finite-difference string (traveling waves,
   reflections, decay), separate from the audio waveguide.
================================================================== */
class VString{
  constructor(n){
    this.n=n;
    this.y=new Float32Array(n); this.yp=new Float32Array(n);
    this.tmp=new Float32Array(n);
    this.c2=0.46; this.damp=0.0007;
    this.env=0; this.fingerAt=-1; this.fingerAmt=0;
  }
  pluck(frac,amp){
    const n=this.n, c=clamp(Math.round(frac*(n-1)),2,n-3);
    const w=Math.max(2.2,n*0.045);
    for(let i=1;i<n-1;i++){
      const d=(i-c)/w, add=amp*Math.exp(-d*d);
      this.y[i]+=add; this.yp[i]+=add;
    }
    this.env=Math.max(this.env,amp*0.35);
  }
  step(){
    const y=this.y,yp=this.yp,t=this.tmp,n=this.n,c2=this.c2;
    let e=0;
    const fA=this.fingerAt,fM=this.fingerAmt;
    for(let i=1;i<n-1;i++){
      const lap=y[i-1]-2*y[i]+y[i+1];
      let d=this.damp;
      if(fM>0.001 && i>fA-3 && i<fA+3) d+=fM;
      const v=(y[i]-yp[i])*(1-d);
      t[i]=y[i]+v+c2*lap;
      e+=v*v;
    }
    t[0]=0; t[n-1]=0;
    const o=this.yp; this.yp=this.y; this.y=this.tmp; this.tmp=o;
    this.env=0.96*this.env+0.04*Math.sqrt(e/n)*10;
    if(fM>0.001) this.fingerAmt*=0.975;
  }
}
const bauV=new VString(120);
let tranhV=[];
function buildTranhVis(){
  tranhV=[]; for(let i=0;i<state.tranh.count;i++) tranhV.push(new VString(72));
}
buildTranhVis();
function visBauPluck(frac,vel){
  bauV.pluck(frac,vel*1.1);
  bauV.fingerAt=Math.round(state.bau.fingerFrac*(bauV.n-1));
  bauV.fingerAmt=0.06;
}
function visTranhPluck(i,pos,vel){ if(tranhV[i]) tranhV[i].pluck(1-pos,vel*1.1); }

/* ---------------- layouts ---------------- */
let bauL=null, tranhL=null;
function buildLayouts(){
  bauL={
    bodyX0:W*0.13, bodyX1:W*0.955, bodyTop:H*0.50, bodyBot:H*0.74,
    sy:H*0.40, rodX:W*0.155, rodTopY:H*0.13, bridgeX:W*0.925
  };
  const c=state.tranh.count, ys=[], bx=[];
  const x0=W*0.09, x1=W*0.93, yT=H*0.17, yB=H*0.88;
  for(let i=0;i<c;i++){
    const t=c>1?i/(c-1):0;
    ys.push(lerp(yT,yB,t));
    bx.push(x0+(x1-x0)*(0.18+0.36*t));
  }
  tranhL={x0,x1,yT,yB,ys,bx,pinX:x1-46,nutX:x0+16};
}
function nearestTranhString(y){
  const L=tranhL; if(!L) return -1;
  const sp=(L.yB-L.yT)/Math.max(1,state.tranh.count-1);
  let best=-1,bd=1e9;
  for(let i=0;i<L.ys.length;i++){
    const d=Math.abs(y-L.ys[i]);
    if(d<bd){ bd=d; best=i; }
  }
  return bd<Math.max(10,sp*0.55)?best:-1;
}

/* ---------------- backgrounds: wood, lacquer, brass ---------------- */
function woodFill(g,x,y,w,h,c1,c2,grainRGBA,nGrain,rnd){
  const gr=g.createLinearGradient(x,y,x,y+h);
  gr.addColorStop(0,c1); gr.addColorStop(0.5,c2); gr.addColorStop(1,c1);
  g.fillStyle=gr; g.fillRect(x,y,w,h);
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
  for(let k=0;k<nGrain;k++){
    const yy=y+rnd()*h;
    g.beginPath();
    let px=x, py=yy;
    g.moveTo(px,py);
    const seg=10+rnd()*14;
    while(px<x+w){
      px+=seg*(0.7+rnd()*0.6);
      py+=(rnd()-0.5)*3.2;
      g.lineTo(px,py);
    }
    g.strokeStyle=grainRGBA;
    g.lineWidth=0.5+rnd()*1.5;
    g.globalAlpha=0.35+rnd()*0.5;
    g.stroke();
  }
  g.globalAlpha=1;
  for(let k=0;k<Math.floor(nGrain/28);k++){
    const kx=x+rnd()*w, ky=y+rnd()*h, kr=3+rnd()*7;
    const kg=g.createRadialGradient(kx,ky,0.5,kx,ky,kr);
    kg.addColorStop(0,'rgba(30,16,6,0.5)');
    kg.addColorStop(1,'rgba(30,16,6,0)');
    g.fillStyle=kg; g.beginPath(); g.arc(kx,ky,kr,0,TAU); g.fill();
  }
  const sh=g.createLinearGradient(x,y,x+w*0.7,y+h);
  sh.addColorStop(0,'rgba(255,240,200,0.10)');
  sh.addColorStop(0.4,'rgba(255,240,200,0.02)');
  sh.addColorStop(1,'rgba(0,0,0,0.14)');
  g.fillStyle=sh; g.fillRect(x,y,w,h);
  g.restore();
}
function mulberry(seed){
  let a=seed>>>0;
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function roomBG(g){
  const rg=g.createRadialGradient(W*0.5,H*0.35,H*0.1,W*0.5,H*0.5,H*1.1);
  rg.addColorStop(0,'#2a2216'); rg.addColorStop(1,'#0d0b08');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
}
let bgBau=null,bgTranh=null;
function buildBG(){
  if(!W||!H) return;
  /* --- đàn bầu: long black-lacquered box, gold trim --- */
  bgBau=document.createElement('canvas');
  bgBau.width=Math.round(W*DPR); bgBau.height=Math.round(H*DPR);
  let g=bgBau.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  roomBG(g);
  const B=bauL, rnd=mulberry(1234);
  g.fillStyle='rgba(0,0,0,0.5)';
  g.beginPath(); g.ellipse((B.bodyX0+B.bodyX1)/2,B.bodyBot+18,(B.bodyX1-B.bodyX0)*0.52,14,0,0,TAU); g.fill();
  woodFill(g,B.bodyX0,B.bodyTop,B.bodyX1-B.bodyX0,B.bodyBot-B.bodyTop,
    '#2a160d','#170c07','rgba(60,30,14,0.5)',90,rnd);
  const lac=g.createLinearGradient(0,B.bodyTop,0,B.bodyBot);
  lac.addColorStop(0,'rgba(255,220,160,0.13)');
  lac.addColorStop(0.25,'rgba(255,220,160,0.03)');
  lac.addColorStop(1,'rgba(0,0,0,0.30)');
  g.fillStyle=lac; g.fillRect(B.bodyX0,B.bodyTop,B.bodyX1-B.bodyX0,B.bodyBot-B.bodyTop);
  g.strokeStyle='rgba(212,168,88,0.55)'; g.lineWidth=1.4;
  g.strokeRect(B.bodyX0+7,B.bodyTop+6,B.bodyX1-B.bodyX0-14,B.bodyBot-B.bodyTop-12);
  g.strokeStyle='rgba(212,168,88,0.25)';
  g.strokeRect(B.bodyX0+12,B.bodyTop+11,B.bodyX1-B.bodyX0-24,B.bodyBot-B.bodyTop-22);
  for(let k=0;k<7;k++){                       /* mother-of-pearl inlay */
    const ix=lerp(B.bodyX0+60,B.bodyX1-60,k/6), iy=(B.bodyTop+B.bodyBot)/2+14;
    const ig=g.createRadialGradient(ix,iy,0.5,ix,iy,6);
    ig.addColorStop(0,'rgba(190,215,225,0.8)');
    ig.addColorStop(0.6,'rgba(150,140,190,0.45)');
    ig.addColorStop(1,'rgba(150,140,190,0)');
    g.fillStyle=ig; g.beginPath(); g.arc(ix,iy,6,0,TAU); g.fill();
  }
  /* peg block + bridge at right */
  woodFill(g,B.bodyX1-34,B.bodyTop-14,30,20,'#4a2c14','#33200f','rgba(20,10,4,0.6)',8,rnd);
  g.fillStyle='#c9b27a';
  g.fillRect(B.bridgeX-2,B.sy-4,4,B.bodyTop-B.sy+8);

  /* --- đàn tranh: paulownia soundboard, rosewood frame --- */
  bgTranh=document.createElement('canvas');
  bgTranh.width=Math.round(W*DPR); bgTranh.height=Math.round(H*DPR);
  g=bgTranh.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  roomBG(g);
  const T=tranhL, rnd2=mulberry(777);
  const bx0=T.x0-30,bx1=T.x1+40,by0=T.yT-40,by1=T.yB+40;
  g.fillStyle='rgba(0,0,0,0.5)';
  g.beginPath(); g.ellipse((bx0+bx1)/2,by1+16,(bx1-bx0)*0.52,16,0,0,TAU); g.fill();
  woodFill(g,bx0,by0,bx1-bx0,by1-by0,'#5c3317','#472507','rgba(28,12,2,0.6)',60,rnd2);
  woodFill(g,bx0+14,by0+14,bx1-bx0-28,by1-by0-28,
    '#b98c4f','#96692f','rgba(90,55,18,0.5)',150,rnd2);
  const sheen=g.createLinearGradient(bx0,by0,bx1,by1);
  sheen.addColorStop(0,'rgba(255,235,190,0.10)');
  sheen.addColorStop(0.5,'rgba(255,235,190,0.02)');
  sheen.addColorStop(1,'rgba(0,0,0,0.16)');
  g.fillStyle=sheen; g.fillRect(bx0+14,by0+14,bx1-bx0-28,by1-by0-28);
  woodFill(g,T.x0-4,by0+14,24,by1-by0-28,'#3c2008','#2b1605','rgba(15,7,1,0.7)',20,rnd2);
  woodFill(g,T.pinX-6,by0+14,T.x1-T.pinX+40,by1-by0-28,'#432408','#301804','rgba(15,7,1,0.7)',24,rnd2);
  g.strokeStyle='rgba(220,180,110,0.35)'; g.lineWidth=1.2;
  g.strokeRect(bx0+10,by0+10,bx1-bx0-20,by1-by0-20);
  for(let i=0;i<T.ys.length;i++){
    const py=T.ys[i], px=T.pinX+22;
    const pg=g.createRadialGradient(px-1.5,py-1.5,0.5,px,py,5.5);
    pg.addColorStop(0,'#ffe9ae'); pg.addColorStop(0.5,'#b98b3a'); pg.addColorStop(1,'#4c3410');
    g.fillStyle=pg; g.beginPath(); g.arc(px,py,5,0,TAU); g.fill();
    /* nhạn — movable bridge, inverted V with bone saddle */
    const bx=T.bx[i];
    g.fillStyle='rgba(0,0,0,0.35)';
    g.beginPath(); g.ellipse(bx,py+13,11,3.4,0,0,TAU); g.fill();
    const wg=g.createLinearGradient(bx-9,py,bx+9,py);
    wg.addColorStop(0,'#7a4a1e'); wg.addColorStop(0.5,'#a87c3e'); wg.addColorStop(1,'#5e3312');
    g.fillStyle=wg;
    g.beginPath();
    g.moveTo(bx-9,py+13); g.lineTo(bx-1.6,py-9); g.lineTo(bx+1.6,py-9); g.lineTo(bx+9,py+13);
    g.lineTo(bx+4.5,py+13); g.lineTo(bx,py-2.5); g.lineTo(bx-4.5,py+13);
    g.closePath(); g.fill();
    g.fillStyle='#efe6d2';
    g.beginPath(); g.arc(bx,py-8.4,2.6,0,TAU); g.fill();
    g.fillStyle='#c8b06a';
    g.font='11px "Palatino Linotype","Segoe UI",serif';
    g.textAlign='left';
    g.fillText(TRANH_LABELS[i],T.x1+18,py+4);
  }
}

/* ---------------- dynamic drawing ---------------- */
function drawStringPath(pts,glow,coreCol,shadowCol,coreW){
  if(glow>0.02){
    ctx.strokeStyle='rgba(255,214,140,'+Math.min(0.4,glow)+')';
    ctx.lineWidth=coreW+4.5;
    ctx.beginPath(); pathPts(pts); ctx.stroke();
  }
  ctx.strokeStyle=shadowCol; ctx.lineWidth=coreW+1.4;
  ctx.beginPath(); pathPtsOff(pts,1.4); ctx.stroke();
  ctx.strokeStyle=coreCol; ctx.lineWidth=coreW;
  ctx.beginPath(); pathPts(pts); ctx.stroke();
}
function pathPts(p){
  ctx.moveTo(p[0],p[1]);
  for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]);
}
function pathPtsOff(p,dy){
  ctx.moveTo(p[0],p[1]+dy);
  for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i],p[i+1]+dy);
}
const bauPts=new Float32Array(240);
function drawBau(){
  ctx.drawImage(bgBau,0,0,W,H);
  const B=bauL, b=state.bau;
  const u=b.rodVis;
  const tipDx=-u*70;
  const rodBaseY=B.bodyTop+14;
  const rodSpan=rodBaseY-B.rodTopY;
  const bendAt=y=>tipDx*Math.pow((rodBaseY-y)/rodSpan,1.7);
  const ax=B.rodX+bendAt(B.sy)+6;

  /* rod (cần đàn) — buffalo-horn taper, bends with tension */
  ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(B.rodX,rodBaseY);
  ctx.quadraticCurveTo(B.rodX+tipDx*0.25,lerp(rodBaseY,B.rodTopY,0.55),
                       B.rodX+tipDx,B.rodTopY);
  ctx.strokeStyle='#1d120a'; ctx.lineWidth=7; ctx.stroke();
  ctx.strokeStyle='#6b4423'; ctx.lineWidth=4.4; ctx.stroke();
  ctx.strokeStyle='rgba(230,190,120,0.35)'; ctx.lineWidth=1.3; ctx.stroke();

  /* gourd (bầu) threaded on the rod at string height */
  const gy=B.sy-2;
  const gg=ctx.createRadialGradient(ax-5,gy-8,2,ax,gy,24);
  gg.addColorStop(0,'#e8c37f'); gg.addColorStop(0.55,'#b07f38'); gg.addColorStop(1,'#5d3d14');
  ctx.fillStyle=gg;
  ctx.beginPath(); ctx.ellipse(ax,gy,15,21,0,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(40,22,6,0.8)'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.fillStyle='#241305';
  ctx.beginPath(); ctx.ellipse(ax+9,gy,4.5,7,0,0,TAU); ctx.fill();

  /* string from gourd to bridge, FDTD shape + bend distortion */
  const n=bauV.n, x1=B.bridgeX;
  const sag=u*-3;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    bauPts[i*2]=lerp(ax+10,x1,t);
    bauPts[i*2+1]=B.sy+bauV.y[i]*26+sag*Math.sin(Math.PI*t);
  }
  drawStringPath(bauPts.subarray(0,n*2),bauV.env*3,'#d8dde2','rgba(10,10,12,0.8)',1.5);

  /* harmonic node markers 1–7 (harmonics 2–8) */
  ctx.textAlign='center'; ctx.font='12px "Palatino Linotype","Segoe UI",serif';
  for(let h=2;h<=8;h++){
    const fx=1-1/h, x=lerp(ax+10,x1,fx);
    const active=b.node===h;
    ctx.fillStyle=active?'#ffd98a':'rgba(200,170,110,0.45)';
    ctx.beginPath();
    ctx.moveTo(x,B.sy+9); ctx.lineTo(x+3.4,B.sy+14); ctx.lineTo(x,B.sy+19); ctx.lineTo(x-3.4,B.sy+14);
    ctx.closePath(); ctx.fill();
    ctx.fillText(String(h-1),x,B.sy+33);
  }
  /* touching finger */
  if(b.fingerT>0.01){
    const fx=lerp(ax+10,x1,b.fingerFrac);
    ctx.fillStyle='rgba(224,172,124,'+(0.85*b.fingerT)+')';
    ctx.beginPath(); ctx.arc(fx,B.sy-1,6.5,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(140,90,50,'+(0.5*b.fingerT)+')';
    ctx.beginPath(); ctx.arc(fx,B.sy-1,6.5,0,Math.PI); ctx.fill();
  }
  /* pluck position indicator */
  const px=lerp(ax+10,x1,1-b.pos);
  ctx.strokeStyle='rgba(255,200,120,0.35)';
  ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(px,B.sy-26); ctx.lineTo(px,B.sy-8); ctx.stroke();
  ctx.setLineDash([]);
}
const tranhPts=new Float32Array(160);
function drawTranh(){
  ctx.drawImage(bgTranh,0,0,W,H);
  const T=tranhL, st=state.tranh, sp=st.specs;
  /* pluck-position band (measured from the fixed right bridge) */
  const avgBx=T.bx[Math.floor(T.bx.length/2)];
  const bandX=T.pinX-(T.pinX-avgBx)*st.pluckPos;
  ctx.fillStyle='rgba(255,210,130,0.06)';
  ctx.fillRect(bandX-4,T.yT-14,8,T.yB-T.yT+28);

  for(let i=0;i<st.count;i++){
    const y=T.ys[i], bx=T.bx[i], v=tranhV[i];
    const wound=sp[i].f<180;
    const core=wound?'#d8a86a':'#d5dbe2';
    const shad=wound?'rgba(60,30,8,0.8)':'rgba(12,12,16,0.8)';
    const cw=wound?2.1:1.4;
    /* left of bridge: press side */
    const pressed=st.pressI===i;
    const dip=pressed?Math.min(26,st.pressCents*0.075):0;
    ctx.strokeStyle=shad; ctx.lineWidth=cw+1.2;
    ctx.beginPath(); ctx.moveTo(T.nutX,y+1.2);
    ctx.quadraticCurveTo((T.nutX+bx)/2,y+dip+1.2,bx,y-7); ctx.stroke();
    ctx.strokeStyle=core; ctx.lineWidth=cw;
    ctx.beginPath(); ctx.moveTo(T.nutX,y);
    ctx.quadraticCurveTo((T.nutX+bx)/2,y+dip,bx,y-8); ctx.stroke();
    if(pressed){
      const hx=(T.nutX+bx)/2;
      ctx.fillStyle='rgba(224,172,124,0.9)';
      ctx.beginPath(); ctx.arc(hx,y+dip-2,7,0,TAU); ctx.fill();
      ctx.fillStyle='#ffd98a'; ctx.font='11px "Palatino Linotype","Segoe UI",serif'; ctx.textAlign='center';
      ctx.fillText('+'+Math.round(st.pressCents)+'¢',hx,y+dip-14);
    }
    /* right of bridge: speaking length, FDTD shape */
    const n=v.n;
    for(let j=0;j<n;j++){
      const t=j/(n-1);
      tranhPts[j*2]=lerp(bx,T.pinX,t);
      tranhPts[j*2+1]=y-8*(1-t)+v.y[j]*20;
    }
    drawStringPath(tranhPts.subarray(0,n*2),v.env*3,core,shad,cw);
  }
}

/* ---------------- HUD ---------------- */
let hudTick=0;
function updateHUD(){
  const h=$('hud');
  if(state.inst==='bau'){
    const b=state.bau,u=b.rodVis;
    const bend=u>=0?330*Math.tanh(1.45*u)/0.8957:520*Math.tanh(1.65*u)/0.9289;
    const f=130.813*Math.pow(2,bend/1200)*b.node;
    h.innerHTML='<b>Đàn Bầu</b><br>'+
      'bồi âm: <b>'+(b.node>1?(b.node)+'×f₀':'dây buông')+'</b> ≈ '+f.toFixed(1)+' Hz<br>'+
      'cần đàn: <b>'+(bend>=0?'+':'')+bend.toFixed(0)+' cents</b><br>'+
      'gảy: lực '+(b.strength*100|0)+'% · vị trí '+(b.pos*100|0)+'%<br>'+
      (b.rung?'<b>rung</b> ':'')+(b.nhan?'<b>nhấn</b>':'');
  }else{
    const t=state.tranh;
    let s='<b>Đàn Tranh</b> — '+t.count+' dây<br>'+
      'vị trí gảy: '+(t.pluckPos*100|0)+'% · móng: '+(t.stiff>0.7?'cứng':'mềm')+'<br>';
    if(t.pressI>=0)
      s+='nhấn dây '+TRANH_LABELS[t.pressI]+': <b>+'+Math.round(t.pressCents)+' cents</b><br>';
    else if(t.lastPluck>=0)
      s+='dây vừa gảy: '+TRANH_LABELS[t.lastPluck]+' ('+noteName(t.specs[t.lastPluck].midi)+')<br>';
    h.innerHTML=s;
  }
}

/* ---------------- main loop ---------------- */
let last=performance.now(), acc=0;
const STEP=1/240;
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.05) dt=0.05;
  acc+=dt;
  let n=0;
  while(acc>STEP&&n<10){
    if(state.inst==='bau') bauV.step();
    else for(let i=0;i<tranhV.length;i++) tranhV[i].step();
    acc-=STEP; n++;
  }
  const b=state.bau;
  b.rodVis+=0.16*(b.rodU-b.rodVis);
  if(b.fingerT>0) b.fingerT*=0.97;
  if(rodDirty&&state.running){ send({t:'bauRod',v:b.rodU}); rodDirty=false; }
  if(W>0){
    if(state.inst==='bau') drawBau(); else drawTranh();
  }
  if(++hudTick>=6){ hudTick=0; updateHUD(); }
  requestAnimationFrame(frame);
}
resize();
setInst('bau');
updateHUD();
requestAnimationFrame(frame);
</script>
