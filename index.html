<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đàn Bầu &amp; Đàn Tranh — Physical Model</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>

<div id="topbar">
  <h1>Đàn Bầu &middot; Đàn Tranh</h1>
  <button class="tab on" id="tabBau">Đàn Bầu</button>
  <button class="tab" id="tabTranh">Đàn Tranh</button>
  <button class="tab" id="centerRod" title="Return to neutral pitch and stop gestures (Esc)">Center rod · Esc</button>
  <label class="sm">dây</label>
  <select id="selCount"><option>16</option><option>17</option><option>19</option><option>21</option></select>
  <label class="sm">mẫu</label>
  <select id="selSR"><option value="48000">48 kHz</option><option value="96000">96 kHz</option></select>
  <span id="lat"></span>
</div>

<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="help"></div>

<div id="overlay">
  <h2>Đàn Bầu &amp; Đàn Tranh</h2>
  <p>Mô hình vật lý — digital waveguide synthesis</p>
  <p>Physical model of Vietnamese monochord and 16-string zither</p>
  <div class="go">Nhấp để bắt đầu — click to begin</div>
  <p id="err"></p>
</div>

<script src="app.js?v=7"></script>
</body>
</html>
